name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  id-token: write
env:
  PROJECT_PATH: src/WhoAmI.CLI/WhoAmI.CLI.csproj
  BUILD_CONFIGURATION: Release
  EXECUTABLE_NAME: whoami-cli
jobs:
  publish:
    name: Publish (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            archive: zip
          - runtime: linux-x64
            archive: tar.gz
          - runtime: linux-arm64
            archive: tar.gz
          - runtime: osx-x64
            archive: tar.gz
          - runtime: osx-arm64
            archive: tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} \
            --runtime ${{ matrix.runtime }}
      - name: Determine version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Publish application
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --no-restore \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output publish/${{ matrix.runtime }}
      - name: Remove debug symbols
        run: |
          find publish/${{ matrix.runtime }} -name "*.pdb" -delete
      - name: Make executable runnable
        if: matrix.archive == 'tar.gz'
        run: |
          chmod +x publish/${{ matrix.runtime }}/${{ env.EXECUTABLE_NAME }}
      - name: Generate release guide
        run: |
          sed "s|<GIT_TAG>|${GITHUB_REF_NAME}|g" \
            docs/cli/release/README.template.md \
            > publish/${{ matrix.runtime }}/README.md

          if grep -q "<GIT_TAG>" publish/${{ matrix.runtime }}/README.md; then
            echo "Release guide generation failed: unresolved <GIT_TAG> placeholder."
            exit 1
          fi
      - name: Copy documentation
        run: |
          cp LICENSE publish/${{ matrix.runtime }}/LICENSE
      - name: Create ZIP archive
        if: matrix.archive == 'zip'
        run: |
          cd publish
          zip -r ${{ env.EXECUTABLE_NAME }}-${{ env.VERSION }}-${{ matrix.runtime }}.zip ${{ matrix.runtime }}
      - name: Create TAR.GZ archive
        if: matrix.archive == 'tar.gz'
        run: |
          cd publish
          tar -czf ${{ env.EXECUTABLE_NAME }}-${{ env.VERSION }}-${{ matrix.runtime }}.tar.gz ${{ matrix.runtime }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release artifacts
        run: |
          cd publish

          for file in *.zip *.tar.gz; do
            echo "Signing ${file}..."

            cosign sign-blob \
              --yes \
              --bundle "${file}.sigstore.json" \
              "${file}"

            if [ ! -f "${file}.sigstore.json" ]; then
              echo "Signature bundle was not generated for ${file}."
              exit 1
            fi
          done
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: |
            publish/*.zip
            publish/*.tar.gz
            publish/*.sigstore.json

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Download published artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Compute SHA-256 hashes
        run: |
          set -euo pipefail

          echo "CLI_WINDOWS_X64_SHA256=$(sha256sum "artifacts/${{ env.EXECUTABLE_NAME }}-${VERSION}-win-x64.zip" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "CLI_LINUX_X64_SHA256=$(sha256sum "artifacts/${{ env.EXECUTABLE_NAME }}-${VERSION}-linux-x64.tar.gz" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "CLI_LINUX_ARM64_SHA256=$(sha256sum "artifacts/${{ env.EXECUTABLE_NAME }}-${VERSION}-linux-arm64.tar.gz" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "CLI_MACOS_X64_SHA256=$(sha256sum "artifacts/${{ env.EXECUTABLE_NAME }}-${VERSION}-osx-x64.tar.gz" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "CLI_MACOS_ARM64_SHA256=$(sha256sum "artifacts/${{ env.EXECUTABLE_NAME }}-${VERSION}-osx-arm64.tar.gz" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Generate release notes
        run: |
          sed \
            -e "s|<GIT_TAG>|${GITHUB_REF_NAME}|g" \
            -e "s|<RELEASE_VERSION>|${VERSION}|g" \
            -e "s|<CLI_WINDOWS_X64_SHA256>|${CLI_WINDOWS_X64_SHA256}|g" \
            -e "s|<CLI_LINUX_X64_SHA256>|${CLI_LINUX_X64_SHA256}|g" \
            -e "s|<CLI_LINUX_ARM64_SHA256>|${CLI_LINUX_ARM64_SHA256}|g" \
            -e "s|<CLI_MACOS_X64_SHA256>|${CLI_MACOS_X64_SHA256}|g" \
            -e "s|<CLI_MACOS_ARM64_SHA256>|${CLI_MACOS_ARM64_SHA256}|g" \
            docs/release/release-notes.template.md \
            > release-notes.md

          for placeholder in \
            "<GIT_TAG>" \
            "<RELEASE_VERSION>" \
            "<CLI_WINDOWS_X64_SHA256>" \
            "<CLI_LINUX_X64_SHA256>" \
            "<CLI_LINUX_ARM64_SHA256>" \
            "<CLI_MACOS_X64_SHA256>" \
            "<CLI_MACOS_ARM64_SHA256>"
          do
            if grep -q "$placeholder" release-notes.md; then
              echo "Release notes generation failed: unresolved placeholder: $placeholder"
              exit 1
            fi
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sigstore.json
