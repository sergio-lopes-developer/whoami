name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT_PATH: src/WhoAmI.CLI/WhoAmI.CLI.csproj
  BUILD_CONFIGURATION: Release
  EXECUTABLE_NAME: whoami-cli

jobs:
  publish:
    name: Publish (${{ matrix.runtime }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - runtime: win-x64
            archive: zip

          - runtime: linux-x64
            archive: tar.gz

          - runtime: linux-arm64
            archive: tar.gz

          - runtime: osx-x64
            archive: tar.gz

          - runtime: osx-arm64
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} \
            --runtime ${{ matrix.runtime }}

      - name: Determine version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish application
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --no-restore \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output publish/${{ matrix.runtime }}

      - name: Make executable runnable
        if: matrix.archive == 'tar.gz'
        run: |
          chmod +x publish/${{ matrix.runtime }}/${{ env.EXECUTABLE_NAME }}

      - name: Copy documentation
        run: |
          cp docs/cli/release/README.md publish/${{ matrix.runtime }}/README.md
          cp LICENSE publish/${{ matrix.runtime }}/LICENSE

      - name: Create ZIP archive
        if: matrix.archive == 'zip'
        run: |
          cd publish
          zip -r ${{ env.EXECUTABLE_NAME }}-${{ env.VERSION }}-${{ matrix.runtime }}.zip ${{ matrix.runtime }}

      - name: Create TAR.GZ archive
        if: matrix.archive == 'tar.gz'
        run: |
          cd publish
          tar -czf ${{ env.EXECUTABLE_NAME }}-${{ env.VERSION }}-${{ matrix.runtime }}.tar.gz ${{ matrix.runtime }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: |
            publish/*.zip
            publish/*.tar.gz

  release:
    name: Create GitHub Release

    needs: publish

    runs-on: ubuntu-latest

    steps:
      - name: Download published artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
